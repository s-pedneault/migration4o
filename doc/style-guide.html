<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="./">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Style Guide — Viewer JS — Migration4o</title>
    <style>
        /* ─── CSS variables ──────────────────────────────────────────────────────── */
:root {
    color-scheme: light;
    --c-bg: #f4f6f9;
    --c-surface: #ffffff;
    --c-border: #e0e5ec;
    --c-border-light: #edf0f5;
    --c-text: #1b2532;
    --c-text-secondary: #262a30;
    --c-text-muted: #8793a4;
    --c-primary: #4f6ef7;
    --c-primary-hover: #3b5ce0;
    --c-primary-selected: #19417c;
    --c-primary-light: #eef2ff;
    --c-primary-glow: rgba(79, 110, 247, .12);
    --c-danger: #ef4444;
    --c-danger-light: #fef2f2;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
    --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
    --shadow-sidebar: 2px 0 16px rgba(0, 0, 0, .05);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sidebar-width: 320px;
    --sidebar-collapsed: 56px;
    --ease-out-expo: cubic-bezier(.16, 1, .3, 1);
    --ease-spring: cubic-bezier(.34, 1.56, .64, 1);
}

*,
*::before,
*::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: var(--font);
    background: var(--c-bg);
    color: var(--c-text);
    font-size: 14px;
    line-height: 1.5;
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

/* ─── App shell ──────────────────────────────────────────────────────────── */
.app {
    display: flex;
    height: 100vh;
    overflow: hidden;
}

/* ─── Sidebar ────────────────────────────────────────────────────────────── */
.nav-sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    background: var(--c-border);
    border-right: 1px solid var(--c-border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
    transition: width .28s var(--ease-out-expo), min-width .28s var(--ease-out-expo);
    flex-shrink: 0;
    box-shadow: var(--shadow-sidebar);
    z-index: 10;
}

.nav-sidebar.icon-only {
    width: var(--sidebar-collapsed);
    min-width: var(--sidebar-collapsed);
}

/* Sidebar header */
.sidebar-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px 0 16px;
    height: 60px;
    border-bottom: 1px solid var(--c-border-light);
    flex-shrink: 0;
    overflow: hidden;
}

.sidebar-brand {
    display: flex;
    align-items: center;
    gap: 11px;
    text-decoration: none;
    flex: 1;
    min-width: 0;
    overflow: hidden;
}

.sidebar-logo {
    width: 34px;
    height: 34px;
    background: linear-gradient(135deg, var(--c-primary-hover), var(--c-primary-selected));
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 16px;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(79, 70, 229, .25);
    transition: transform .2s var(--ease-spring), box-shadow .2s ease;
}

.sidebar-brand:hover .sidebar-logo {
    transform: scale(1.06);
    box-shadow: 0 3px 12px rgba(79, 70, 229, .35);
}

.sidebar-name {
    font-size: 15px;
    font-weight: 800;
    letter-spacing: -.3px;
    color: var(--c-text);
    white-space: nowrap;
    overflow: hidden;
    transition: opacity .18s ease, width .28s var(--ease-out-expo);
}

.icon-only .sidebar-name {
    width: 0;
    opacity: 0;
    pointer-events: none;
}

.sidebar-toggle {
    width: 30px;
    height: 30px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--c-text-muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .15s, color .15s, transform .15s ease;
    padding: 0;
}

.sidebar-toggle:hover {
    background: var(--c-bg);
    color: var(--c-text);
}

.sidebar-toggle:active {
    transform: scale(.92);
}

.sidebar-toggle svg {
    width: 18px;
    height: 18px;
}

/* Nav scroll area */
.sidebar-nav {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 10px 8px;
}

/* ─── Sidebar search bar ─────────────────────────────────────────────────── */
.sidebar-search {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 6px 8px 2px;
    padding: 0 8px;
    height: 32px;
    background: var(--c-bg);
    border: 1px solid var(--c-border);
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s, opacity .18s;
    flex-shrink: 0;
}

.sidebar-search:focus-within {
    border-color: var(--c-primary);
    box-shadow: 0 0 0 3px var(--c-primary-glow);
}

.nav-search-icon {
    flex-shrink: 0;
    color: var(--c-text-muted);
    pointer-events: none;
    transition: color .15s;
}

.sidebar-search:focus-within .nav-search-icon {
    color: var(--c-primary);
}

.nav-search-input {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font);
    font-size: 12.5px;
    color: var(--c-text);
    outline: none;
    min-width: 0;
}

.nav-search-input::placeholder {
    color: var(--c-text-muted);
}

.nav-search-clear {
    flex-shrink: 0;
    width: 18px;
    height: 18px;
    border: none;
    background: transparent;
    color: var(--c-text-muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    transition: opacity .15s, background .12s, color .12s;
}

.nav-search-clear:hover {
    background: var(--c-border);
    color: var(--c-text);
}

.icon-only .sidebar-search {
    opacity: 0;
    pointer-events: none;
    height: 0;
    margin: 0;
    overflow: hidden;
}

/* Custom scrollbar */
.sidebar-nav::-webkit-scrollbar {
    width: 5px;
}

.sidebar-nav::-webkit-scrollbar-track {
    background: transparent;
}

.sidebar-nav::-webkit-scrollbar-thumb {
    background: var(--c-border);
    border-radius: 10px;
}

.sidebar-nav::-webkit-scrollbar-thumb:hover {
    background: var(--c-text-muted);
}

/* Section label (for top-level module groups) */
.nav-section-label {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--c-text-muted);
    padding: 16px 10px 6px;
    user-select: none;
    transition: opacity .18s;
}

.nav-section-label:first-child {
    padding-top: 4px;
}

.icon-only .nav-section-label {
    opacity: 0;
    height: 0;
    padding: 0;
    overflow: hidden;
}

/* Module group rows */
.nav-group-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    width: 100%;
    padding: 0 10px;
    height: 38px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-align: left;
    font-family: var(--font);
    font-size: 13.5px;
    font-weight: 600;
    color: var(--c-text);
    background: transparent;
    transition: background .15s ease, color .15s ease;
    white-space: nowrap;
    overflow: hidden;
    margin-bottom: 1px;
    position: relative;
}

.nav-group-toggle:hover {
    background: var(--c-bg);
}

.nav-group-toggle.open {
    color: var(--c-primary);
}

.nav-group-toggle.open:hover {
    background: var(--c-primary-glow);
}

.nav-group-icon {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 1;
    transition: opacity .12s, transform .2s var(--ease-spring);
}

.nav-group-icon svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke .15s ease;
}

.nav-group-icon svg.tabler-icon-filled {
    fill: currentColor;
    stroke: none;
    stroke-width: 0;
    transition: fill .15s ease;
}

.nav-group-toggle.open .nav-group-icon svg {
    stroke: var(--c-primary);
}

.nav-group-toggle.open .nav-group-icon svg.tabler-icon-filled {
    fill: var(--c-primary);
    stroke: none;
}

.nav-group-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: opacity .18s ease;
}

.icon-only .nav-group-label,
.icon-only .nav-chevron {
    opacity: 0;
    pointer-events: none;
    width: 0;
    overflow: hidden;
}

.nav-chevron {
    flex-shrink: 0;
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    transition: transform .25s var(--ease-out-expo), background .15s, opacity .15s;
}

.nav-chevron svg {
    width: 14px;
    height: 14px;
    stroke: var(--c-text-muted);
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke .15s;
}

.nav-group-toggle:hover .nav-chevron {
    background: rgba(0, 0, 0, .04);
}

.nav-group-toggle.open>.nav-chevron {
    transform: rotate(90deg);
}

.nav-group-toggle.open>.nav-chevron svg {
    stroke: var(--c-primary);
}

/* Children container with smooth animation */
.nav-group-children {
    overflow: hidden;
    max-height: 0;
    transition: max-height .3s var(--ease-out-expo), opacity .2s ease;
    opacity: 0;
    position: relative;
}

.nav-group-children.open {
    max-height: 9999px;
    opacity: 1;
}

/* Tree connector line */
.nav-group-children.open::before {
    content: '';
    position: absolute;
    left: 19px;
    top: 2px;
    bottom: 2px;
    width: 1.5px;
    background: var(--c-border-light);
    border-radius: 1px;
}

.icon-only .nav-group-children {
    display: none;
}

/* Leaf items */
.nav-item-link {
    display: flex;
    align-items: center;
    gap: 7px;
    text-decoration: none;
    overflow: hidden;
    width: 100%;
    padding: 0 10px;
    height: 34px;
    font-size: 13px;
    font-weight: 500;
    color: var(--c-text-secondary);
    border-radius: 7px;
    margin-bottom: 1px;
    transition: background .12s ease, color .12s ease, transform .1s ease;
    white-space: nowrap;
    position: relative;
}

.nav-item-icon {
    flex-shrink: 0;
    /* width: 20px; */
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity .12s, transform .15s ease;
}

.nav-item-icon svg {
    width: 16px;
    height: 16px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .65;
    transition: opacity .12s, stroke .12s;
}

/* Tabler filled icons must not have stroke or fill:none overridden */
.nav-item-icon svg.tabler-icon-filled {
    fill: currentColor;
    stroke: none;
    stroke-width: 0;
}

.nav-item-label {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    transition: opacity .18s ease;
}

.icon-only .nav-item-label {
    opacity: 0;
    width: 0;
    pointer-events: none;
}

.nav-item-link:hover {
    background: var(--c-bg);
    color: var(--c-text);
}

.nav-item-link:hover .nav-item-icon svg {
    opacity: .9;
}

.nav-item-link:active {
    transform: scale(.98);
}

/* Current / active item */
.nav-item-link.nav-current {
    background: var(--c-primary-light);
    color: var(--c-primary);
    font-weight: 600;
}

.nav-item-link.nav-current::before {
    content: '';
    position: absolute;
    left: 0;
    top: 6px;
    bottom: 6px;
    width: 3px;
    background: var(--c-primary);
    border-radius: 0 3px 3px 0;
}

.nav-item-link.nav-current .nav-item-icon svg {
    opacity: 1;
    stroke: var(--c-primary);
}

/* Inside tile children the link uses margin-left (set by JS) to align with
   the parent connector line. width:auto lets the element naturally fill the
   remaining width after that margin so the background starts at the right edge. */
.nav-tile-children .nav-item-link {
    width: auto;
}

/* The absolute ::before bar can't follow a dynamic margin-left, so replace
   it with a left border that is part of the element box. */
.nav-tile-children .nav-item-link.nav-current::before {
    display: none;
}

.nav-tile-children .nav-item-link.nav-current {
    border-left: 3px solid var(--c-primary);
    padding-left: 7px;
}

/* Keyboard focus highlight (Tab / arrow navigation from search) */
.nav-item-link.nav-item-kbfocus {
    background: var(--c-primary-light);
    color: var(--c-primary);
    outline: none;
    box-shadow: inset 0 0 0 2px var(--c-primary);
    border-radius: 5px;
}

.nav-tile-children .nav-item-link.nav-item-kbfocus {
    border-radius: 0 5px 5px 0;
}

/* ─── Module tile (depth-0 modules) ─────────────────────────────────────── */

/* 8-hue palette — one per top-level module slot, cycles automatically */
.nav-tile-c0 {
    --tile-bg: #e8f0fe;
    --tile-bg-open: #d2e3fc;
    --tile-accent: #1a73e8;
    --tile-text: #1a1a2e;
}

.nav-tile-c1 {
    --tile-bg: #fce8e6;
    --tile-bg-open: #f9d0cb;
    --tile-accent: #d93025;
    --tile-text: #2d1a18;
}

.nav-tile-c2 {
    --tile-bg: #e6f4ea;
    --tile-bg-open: #ceead6;
    --tile-accent: #188038;
    --tile-text: #1a2d1e;
}

.nav-tile-c3 {
    --tile-bg: #fef7e0;
    --tile-bg-open: #feefc3;
    --tile-accent: #e37400;
    --tile-text: #2d2310;
}

.nav-tile-c4 {
    --tile-bg: #f3e8fd;
    --tile-bg-open: #e4c5f9;
    --tile-accent: #9334ea;
    --tile-text: #24112d;
}

.nav-tile-c5 {
    --tile-bg: #e8f5fe;
    --tile-bg-open: #c7e4f9;
    --tile-accent: #0288d1;
    --tile-text: #102030;
}

.nav-tile-c6 {
    --tile-bg: #fff0f3;
    --tile-bg-open: #ffd6df;
    --tile-accent: #d81b60;
    --tile-text: #2d1020;
}

.nav-tile-c7 {
    --tile-bg: #e9f9f6;
    --tile-bg-open: #c4ede5;
    --tile-accent: #00897b;
    --tile-text: #102820;
}

.nav-module-tile {
    border-radius: 10px;
    /* background: var(--tile-bg); */
    margin-bottom: 6px;
    overflow: hidden;
    transition: box-shadow .18s ease;
}

.nav-module-tile:hover {
    box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
}

.nav-tile-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    min-height: 56px;
    padding: 10px 14px;
    border: none;
    background: transparent;
    cursor: pointer;
    text-align: left;
    font-family: var(--font);
    background: var(--tile-bg-open);
}

.nav-module-tile.open>.nav-tile-btn {
    /* background: var(--tile-bg-open); */
}

.nav-tile-icon {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--tile-accent);
}

.nav-tile-icon svg {
    width: 40px;
    height: 40px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.nav-tile-label {
    flex: 1;
    font-size: 16px;
    font-weight: 700;
    color: var(--tile-text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    line-height: 1.3;
}

.nav-tile-children {
    border-left: 3px solid var(--c-primary-selected);
    margin-left: 14px;
    margin-right: 0;
    padding-bottom: 4px;
}

/* L2 vertical connector line — grey */
.nav-tile-children .nav-group-children.open::before {
    background: #adb5c6;
}

/* ── Sub-group headers at depth 1+ (inside a module tile) ──────────────
   margin-left and border-radius are set inline by JS so they are immune
   to specificity issues. CSS only controls colors here.
── */

/* L2 tiles — light blue */
.nav-tile-children .nav-group-toggle {
    background: #e4f0fd;
    color: var(--c-primary-selected);
}

.nav-tile-children .nav-group-toggle:hover {
    background: #cce3f7;
    color: var(--c-primary-selected);
}

.nav-tile-children .nav-group-toggle.open {
    background: #c3ddf4;
    color: var(--c-primary-selected);
}

.nav-tile-children .nav-group-toggle.open:hover {
    background: #b5d5ef;
}

/* L3+ tiles — grey */
.nav-tile-children .nav-group-children .nav-group-toggle {
    background: #e9ecf0;
    color: var(--c-primary-selected);
}

.nav-tile-children .nav-group-children .nav-group-toggle:hover {
    background: #dde1e8;
    color: var(--c-primary-selected);
}

.nav-tile-children .nav-group-children .nav-group-toggle.open {
    background: #d0d6df;
    color: var(--c-primary-selected);
}

.nav-tile-children .nav-group-children .nav-group-toggle.open:hover {
    background: #c7cdd7;
}

.icon-only .nav-module-tile {
    border-radius: 8px;
    margin-bottom: 4px;
}

.icon-only .nav-tile-label {
    opacity: 0;
    width: 0;
    overflow: hidden;
    pointer-events: none;
}

.icon-only .nav-tile-btn {
    min-height: 44px;
    padding: 8px;
    justify-content: center;
    gap: 0;
}

.icon-only .nav-tile-children {
    display: none;
}

/* Count badge for children */
.nav-child-count {
    font-size: 10px;
    font-weight: 600;
    color: var(--c-text-muted);
    background: var(--c-bg);
    padding: 1px 6px;
    border-radius: 10px;
    margin-left: 4px;
    margin-right: 2px;
    flex-shrink: 0;
    transition: opacity .18s, color .15s, background .15s;
}

.nav-group-toggle.open .nav-child-count {
    background: var(--c-primary-light);
    color: var(--c-primary);
}

.icon-only .nav-child-count {
    opacity: 0;
    width: 0;
    overflow: hidden;
    padding: 0;
    margin: 0;
}

/* Sidebar footer */
.sidebar-foot {
    border-top: 1px solid var(--c-border-light);
    padding: 10px 8px 10px;
    flex-shrink: 0;
    overflow: hidden;
    background: linear-gradient(to top, rgba(244, 246, 249, .5), transparent);
}

.sidebar-foot-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 10px;
    overflow: hidden;
    border-radius: 8px;
    transition: background .15s;
}

.sidebar-foot-row:hover {
    background: var(--c-bg);
}

.sidebar-foot-icon {
    font-size: 13px;
    flex-shrink: 0;
    width: 22px;
    text-align: center;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.sidebar-foot-icon svg {
    width: 16px;
    height: 16px;
    stroke: var(--c-text-muted);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.lang-select {
    height: 26px;
    padding: 0 6px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    color: var(--c-text-secondary);
    font-size: 12px;
    font-family: var(--font);
    flex: 1;
    min-width: 0;
    transition: opacity .15s;
}

.icon-only .lang-select,
.icon-only .sidebar-badge-text {
    opacity: 0;
    width: 0;
    overflow: hidden;
    pointer-events: none;
}

.sidebar-badge-text {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--c-text-muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
    min-width: 0;
    transition: opacity .18s;
}

/* ═══════════════════════════════════════════════════════════════════════════
   MAIN CONTENT AREA
   ═══════════════════════════════════════════════════════════════════════════ */
.app-main {
    flex: 1;
    min-width: 0;
}

/* ═══════════════════════════════════════════════════════════════════════════
   WELCOME PAGE
   ═══════════════════════════════════════════════════════════════════════════ */
.welcome-page .app-main {
    overflow-y: auto;
    padding: 32px 40px;
}

.welcome-header {
    margin-bottom: 32px;
}

.welcome-header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -.5px;
    color: var(--c-text);
    margin-bottom: 6px;
}

.welcome-header .subtitle {
    font-size: 15px;
    color: var(--c-text-secondary);
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
}

.info-card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
}

.info-card .card-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--c-text-muted);
    margin-bottom: 6px;
}

.info-card .card-value {
    font-size: 22px;
    font-weight: 800;
    color: var(--c-primary);
    letter-spacing: -.5px;
}

.info-card .card-detail {
    font-size: 12px;
    color: var(--c-text-secondary);
    margin-top: 3px;
}

.welcome-section {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    margin-bottom: 20px;
    box-shadow: var(--shadow-sm);
}

.welcome-section h2 {
    font-size: 14px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--c-text-secondary);
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--c-border-light);
}

.welcome-section p {
    color: var(--c-text-secondary);
    font-size: 13.5px;
    line-height: 1.7;
}

.placeholder-text {
    color: var(--c-text-muted);
    font-style: italic;
}

/* ═══════════════════════════════════════════════════════════════════════════
   VIEWER PAGE
   ═══════════════════════════════════════════════════════════════════════════ */
.viewer-page .app-main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.app-body {
    flex: 1;
    overflow: hidden;
    padding: 14px 16px 16px;
    display: flex;
    flex-direction: column;
}

.panel-left {
    flex: 1;
    display: flex;
    flex-direction: column;
    background: var(--c-surface);
    min-width: 0;
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    overflow: hidden;
}

.columns-btn {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    color: var(--c-text-secondary);
    font-size: 12px;
    font-family: var(--font);
}

.entity-header {
    padding: 16px 20px 14px;
    border-bottom: 1px solid var(--c-border);
    background: var(--c-surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.entity-xml-btn {
    border: 1px solid var(--c-border);
    background: var(--c-surface);
    color: var(--c-text-secondary);
    border-radius: 8px;
    height: 30px;
    padding: 0 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
    letter-spacing: 0.04em;
    flex-shrink: 0;
}

.entity-xml-btn:hover {
    background: var(--c-bg);
    color: var(--c-text);
}

.entity-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--c-text);
    line-height: 1.2;
}

.search-section {
    padding: 14px 16px;
    border-bottom: 1px solid var(--c-border);
}

.search-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}

.search-header h2 {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--c-text-secondary);
}

.search-tools {
    display: flex;
    gap: 8px;
    align-items: center;
}

.columns-menu-wrap {
    position: relative;
}

.columns-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    width: 320px;
    max-height: 280px;
    overflow: auto;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    box-shadow: var(--shadow);
    padding: 8px;
    z-index: 50;
    display: none;
}

.columns-menu.open {
    display: block;
}

.columns-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 6px;
    font-size: 12px;
}

.columns-item:hover {
    background: #f6f8fc;
}

.search-actions {
    display: flex;
    gap: 6px;
}

.search-condition {
    margin-bottom: 8px;
}

.condition-main {
    display: flex;
    align-items: center;
    gap: 6px;
}

.search-condition .logic-label {
    min-width: 34px;
    text-align: center;
    font-size: 10px;
    font-weight: 700;
    color: var(--c-primary);
    text-transform: uppercase;
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    background: var(--c-primary-light);
    border: 1px solid transparent;
    transition: all .15s;
    user-select: none;
}

.search-condition .logic-label.first {
    visibility: hidden;
}

.search-condition select,
.search-condition input[type="text"] {
    height: 32px;
    padding: 0 8px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: var(--font);
    background: var(--c-surface);
    color: var(--c-text);
}

.condition-main .field-select {
    flex: 2;
    min-width: 130px;
}

.condition-main .field-filter {
    flex: 0 0 120px;
    min-width: 90px;
    max-width: 140px;
}

.condition-main .operator-select {
    flex: 1;
    min-width: 90px;
}

.condition-main .value-input {
    flex: 2;
    min-width: 110px;
}

.search-condition .remove-btn {
    width: 26px;
    height: 26px;
    border: none;
    background: none;
    font-size: 16px;
    color: var(--c-text-muted);
    cursor: pointer;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    flex-shrink: 0;
}

.search-condition .remove-btn:hover {
    background: var(--c-danger-light);
    color: var(--c-danger);
}

/* ── Hierarchical field picker ─────────────────────────────────────────── */

.field-picker {
    position: relative;
    flex: 2;
    min-width: 160px;
}

.field-picker-btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    color: var(--c-text);
    font-size: 13px;
    font-family: var(--font);
    cursor: pointer;
    text-align: left;
    gap: 6px;
    transition: border-color .15s;
}

.field-picker-btn:hover {
    border-color: var(--c-primary);
}

.field-picker-text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.field-picker-chevron {
    font-size: 11px;
    color: var(--c-text-muted);
    flex-shrink: 0;
}

.field-picker-popup {
    display: none;
    position: absolute;
    top: calc(100% + 3px);
    left: 0;
    min-width: 280px;
    max-height: 380px;
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(0, 0, 0, .12);
    z-index: 1000;
    flex-direction: column;
}

.field-picker-popup.open {
    display: flex;
}

.fp-search-wrap {
    padding: 6px;
    border-bottom: 1px solid var(--c-border);
    flex-shrink: 0;
}

.fp-search {
    width: 100%;
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--c-border);
    border-radius: 5px;
    font-size: 12px;
    font-family: var(--font);
    background: var(--c-bg);
    color: var(--c-text);
    box-sizing: border-box;
}

.fp-search:focus {
    outline: none;
    border-color: var(--c-primary);
    box-shadow: 0 0 0 2px var(--c-primary-glow);
}

.fp-list {
    overflow-y: auto;
    flex: 1;
    padding: 4px 0;
}

/* Group header */
.fpt-group-header {
    display: flex;
    align-items: center;
    width: 100%;
    padding: 5px 10px;
    border: none;
    background: none;
    font-size: 12px;
    font-family: var(--font);
    color: var(--c-text-secondary);
    cursor: pointer;
    gap: 5px;
    text-align: left;
    font-weight: 600;
}

.fpt-group-header:hover {
    background: var(--c-bg);
}

.fpt-chevron {
    font-size: 10px;
    width: 12px;
    text-align: center;
    flex-shrink: 0;
    color: var(--c-text-muted);
}

.fpt-group-label {
    flex: 1;
}

.fpt-group-count {
    font-size: 10px;
    color: var(--c-text-muted);
    font-weight: 400;
    margin-left: auto;
    padding-right: 4px;
}

.fpt-group-body {
    display: none;
}

.fpt-group-body.open {
    display: block;
}

/* Leaf item */
.fpt-item {
    display: block;
    width: 100%;
    padding: 4px 10px 4px 26px;
    border: none;
    background: none;
    font-size: 12px;
    font-family: var(--font);
    color: var(--c-text);
    cursor: pointer;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: background .1s;
}

.fpt-item:hover {
    background: var(--c-primary-light);
    color: var(--c-primary);
}

.fpt-item.selected {
    background: var(--c-primary-light);
    color: var(--c-primary);
    font-weight: 600;
}

.fpt-item--all {
    padding-left: 10px;
    font-style: italic;
    color: var(--c-text-muted);
    border-bottom: 1px solid var(--c-border-light);
    margin-bottom: 2px;
    padding-bottom: 5px;
}

.fpt-item--all:hover,
.fpt-item--all.selected {
    color: var(--c-primary);
}

.btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 600;
    font-family: var(--font);
    cursor: pointer;
    background: var(--c-surface);
    color: var(--c-text-secondary);
    transition: all .15s;
    white-space: nowrap;
}

.btn:hover {
    background: var(--c-bg);
    border-color: #ccd3dd;
}

.btn-primary {
    background: var(--c-primary);
    color: #fff;
    border-color: var(--c-primary);
}

.btn-primary:hover {
    background: var(--c-primary-hover);
    border-color: var(--c-primary-hover);
}

.btn-sm {
    padding: 4px 8px;
    font-size: 11px;
}

.results-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.results-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-bottom: 1px solid var(--c-border-light);
    font-size: 12px;
    color: var(--c-text-secondary);
    background: #fafbfd;
}

.results-count {
    font-weight: 600;
}

.results-scroll {
    flex: 1;
    overflow-y: auto;
}

.results-table {
    width: 100%;
    border-collapse: collapse;
}

.results-table thead th {
    position: sticky;
    top: 0;
    background: #fafbfd;
    text-align: left;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--c-text-muted);
    padding: 8px 14px;
    border-bottom: 1px solid var(--c-border);
    z-index: 2;
    white-space: nowrap;
    vertical-align: bottom;
}

.results-table tbody td {
    padding: 8px 14px;
    font-size: 13px;
    border-bottom: 1px solid var(--c-border-light);
    max-width: 280px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.results-table tbody tr {
    cursor: pointer;
    transition: background .1s;
}

/* Composite column header (e.g. adresse.rue → ADRESSE stacked above RUE) */
.col-hd {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    white-space: normal;
}

.col-hd-prefix {
    font-size: 0.68em;
    opacity: 0.6;
    line-height: 1.3;
    font-weight: 600;
}

.col-hd-leaf {
    /* inherits th font-size / weight */
}

.results-table tbody tr:hover {
    background: #f5f8ff;
}

.results-table tbody tr.active {
    background: var(--c-primary-light);
    border-left: 3px solid var(--c-primary);
}

.results-empty,
.welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    color: var(--c-text-muted);
    text-align: center;
}

.results-empty .icon,
.welcome .icon {
    font-size: 36px;
    margin-bottom: 12px;
    opacity: .45;
}

.pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    border-top: 1px solid var(--c-border);
    background: #fafbfd;
    font-size: 12px;
    color: var(--c-text-secondary);
}

.pagination-controls {
    display: flex;
    align-items: center;
    gap: 6px;
}

.pagination button,
.pagination select {
    height: 28px;
    padding: 0 8px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    font-size: 12px;
    font-family: var(--font);
    color: var(--c-text);
    cursor: pointer;
}

.pagination button:disabled {
    opacity: .4;
    cursor: default;
}

.detail-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, .45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 24px;
}

.detail-overlay.open {
    display: flex;
}

.detail-sheet {
    width: min(1500px, calc(100vw - 48px));
    height: min(94vh, calc(100vh - 56px));
    background: #edf1f7;
    border-radius: 16px;
    border: 1px solid var(--c-border);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 12px 32px rgba(0, 0, 0, .24);
}

.detail-sheet-top {
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
    gap: 8px;
}

.detail-sheet-top-left {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
}

.detail-sheet-logo {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    flex-shrink: 0;
}

.detail-sheet-appname {
    font-size: 14px;
    font-weight: 700;
    color: var(--c-text);
    letter-spacing: -.2px;
    white-space: nowrap;
}

.detail-sheet-top-center {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
}

.detail-drag {
    width: 42px;
    height: 4px;
    border-radius: 2px;
    background: #c5cfdd;
}

.detail-sheet-top-right {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
}

.detail-xml-btn {
    border: 1px solid var(--c-border);
    background: var(--c-surface);
    color: var(--c-text-secondary);
    border-radius: 8px;
    height: 30px;
    padding: 0 10px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
    letter-spacing: 0.04em;
}

.detail-xml-btn:hover {
    background: var(--c-bg);
    color: var(--c-text);
}

.detail-btn-sep {
    display: inline-block;
    width: 8px;
    flex-shrink: 0;
}

.detail-nav-btn {
    border: 1px solid var(--c-border);
    background: var(--c-surface);
    color: var(--c-text-secondary);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background .15s, color .15s;
    padding: 0;
}

.detail-nav-btn:hover:not(:disabled) {
    background: var(--c-bg);
    color: var(--c-text);
}

.detail-nav-btn:disabled {
    opacity: .35;
    cursor: default;
}

.detail-nav-pos {
    font-size: 11px;
    color: var(--c-text-muted);
    white-space: nowrap;
    min-width: 40px;
    text-align: center;
}

.detail-close {
    border: 1px solid var(--c-border);
    background: var(--c-surface);
    color: var(--c-text-secondary);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: background .15s, color .15s;
    padding: 0;
}

.detail-close:hover {
    background: var(--c-danger-light);
    color: var(--c-danger);
}

.detail-scroll {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 36px;
}

/* ── Hero Header ──────────────────────────────────────────────────── */
.detail-hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    padding: 18px 28px 16px;
    background: linear-gradient(135deg, #f8faff 0%, #eef2ff 60%, #f0f4ff 100%);
    border-bottom: 2px solid var(--c-border);
    flex-shrink: 0;
}

.detail-hero-left {
    flex: 1;
    min-width: 0;
}

.detail-hero-right {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    padding-top: 2px;
}

.detail-hero-entity {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .8px;
    color: var(--c-primary);
    background: rgba(79, 110, 247, .1);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 7px;
}

.detail-hero-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--c-text);
    letter-spacing: -.3px;
    line-height: 1.25;
    margin-bottom: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
}

.detail-hero-subtitle {
    font-size: 13px;
    color: var(--c-text-secondary);
    line-height: 1.45;
}

.detail-hero-meta {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--c-text-muted);
    white-space: nowrap;
}

.detail-hero-meta strong {
    color: var(--c-text-secondary);
    font-weight: 600;
}

/* ── Preview images ──────────────────────────────────────────────── */
/* Hero preview – large clickable block at the top of a detail view */
.detail-hero-preview {
    margin: 8px 0;
}

.detail-hero-preview img {
    max-width: 100%;
    max-height: 280px;
    border-radius: 4px;
}

/* Inline thumbnail – small image next to text in headers / table cells */
.preview-thumb {
    vertical-align: middle;
    border-radius: 3px;
}

.preview-thumb-sm {
    max-height: 24px;
    border-radius: 2px;
}

.preview-thumb-md {
    max-height: 40px;
    margin-left: 8px;
}

/* Inline linked preview – medium preview inside expandable content */
.preview-inline {
    margin-top: 6px;
}

.preview-inline img {
    max-width: 100%;
    max-height: 200px;
    border-radius: 4px;
}

/* Turquoise button that reveals an attachment preview on click */
.preview-reveal-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    font-size: 11px;
    font-weight: 600;
    color: #134e4a;
    background: #ccfbf1;
    border: 1px solid #5eead4;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
}

.preview-reveal-btn:hover {
    background: #99f6e4;
    border-color: #2dd4bf;
}

.preview-reveal-img {
    margin-top: 6px;
}

.preview-reveal-img img {
    max-width: 100%;
    max-height: 220px;
    border-radius: 4px;
    display: block;
}

/* ── Key Info Card ────────────────────────────────────────────────── */
.detail-key-info {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-top: 3px solid var(--c-primary);
    border-radius: var(--radius-lg);
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    overflow: hidden;
}

.detail-key-info-title {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .6px;
    color: var(--c-primary);
    padding: 10px 16px;
    background: linear-gradient(to bottom, #f8faff, #f3f5fb);
    border-bottom: 1px solid var(--c-border-light);
}

.detail-header {
    padding: 16px 20px;
    background: var(--c-surface);
    border-bottom: 1px solid var(--c-border);
}

.detail-header h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 2px;
}

.detail-header .detail-subtitle {
    font-size: 12px;
    color: var(--c-text-secondary);
}

.field-group {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-lg);
    margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .06);
    overflow: hidden;
}

.field-group-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .4px;
    color: var(--c-text-secondary);
    padding: 10px 16px;
    background: #eef1f6;
    border-bottom: 1px solid var(--c-border-light);
}

.field-row {
    display: flex;
    border-bottom: 1px solid var(--c-border-light);
    min-height: 34px;
}

.field-row:last-child {
    border-bottom: none;
}

.field-pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid var(--c-border-light);
}

.field-pair:last-child {
    border-bottom: none;
}

.field-pair .field-row {
    border-bottom: none;
}

.field-pair .field-row:first-child {
    border-right: 1px solid var(--c-border-light);
}

.field-label {
    flex: 0 0 240px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--c-text-secondary);
    background: #fcfcfe;
    word-break: break-word;
}

.field-value {
    flex: 1;
    padding: 8px 16px;
    font-size: 13px;
    color: var(--c-text);
    word-break: break-word;
    min-width: 0;
    white-space: pre-wrap;
}

.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
}

.badge-id {
    background: #fde68a;
    color: #78350f;
    font-family: var(--font-mono);
}

.badge-number {
    background: #c7d2fe;
    color: #312e81;
    font-family: var(--font-mono);
}

.badge-true {
    background: #bbf7d0;
    color: #14532d;
}

.badge-false {
    background: #fecaca;
    color: #7f1d1d;
}

.collection-table {
    width: 100%;
    border-collapse: collapse;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    overflow: hidden;
    font-size: 12px;
}

.collection-table th {
    background: #f5f7fa;
    font-size: 11px;
    font-weight: 700;
    text-align: left;
    padding: 6px 10px;
    border-bottom: 1px solid var(--c-border);
    border-right: 1px solid var(--c-border);
    color: var(--c-text-secondary);
}
.collection-table th:last-child { border-right: none; }

.collection-table td {
    padding: 5px 10px;
    border-bottom: 1px solid var(--c-border-light);
    border-right: 1px solid var(--c-border-light);
    vertical-align: top;
}
.collection-table td:last-child { border-right: none; }

.collection-table tr:last-child td {
    border-bottom: none;
}

/* ── Cell popup trigger button ─────────────────────────────────────── */
.cell-popup-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #dcfce7;
    color: #15803d;
    border: 1px solid #86efac;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    cursor: pointer;
    white-space: nowrap;
    line-height: 1.5;
    transition: background 0.1s, border-color 0.1s;
}

.cell-popup-btn:hover {
    background: #bbf7d0;
    border-color: #4ade80;
}

/* ── Cell popup: per-level overlay model ────────────────────────────── */
/* Each popup gets its own full-screen overlay. The overlay for level N sits
   on top of the overlay+dialog of level N-1, blocking interaction and
   dimming everything below it. z-index is set inline by JS. */

.cell-popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.35);
    /* z-index set inline: 9000 + depth*20 */
    align-items: center;
    justify-content: center;
    padding: 24px;
}

.cell-popup-overlay.open {
    display: flex;
}

.cell-popup-dialog {
    background: var(--c-surface, #fff);
    border: 1px solid var(--c-border, #e2e8f0);
    border-radius: var(--radius, 8px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    width: min(860px, 92vw);
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    /* slight cascading offset applied via margin by JS */
}

.cell-popup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--c-border, #e2e8f0);
    background: #f8fafc;
    flex-shrink: 0;
}

.cell-popup-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.35px;
    color: var(--c-text-secondary, #475569);
}

.cell-popup-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 16px;
    color: var(--c-text-muted, #94a3b8);
    padding: 2px 5px;
    line-height: 1;
    border-radius: 4px;
}

.cell-popup-close:hover {
    background: var(--c-hover, #f1f5f9);
    color: var(--c-text-primary, #0f172a);
}

.cell-popup-body {
    overflow-y: auto;
    padding: 12px;
    flex: 1;
}

.popup-empty {
    color: var(--c-text-muted, #94a3b8);
    padding: 16px;
    text-align: center;
    margin: 0;
}

/* Key-value table for single-item popups */
.popup-kv-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.popup-kv-table th {
    width: 38%;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--c-text-secondary, #475569);
    background: var(--c-surface-alt, #f8fafc);
    padding: 7px 12px;
    border-bottom: 1px solid var(--c-border, #e2e8f0);
    vertical-align: top;
}

.popup-kv-table td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--c-border, #e2e8f0);
    vertical-align: top;
    color: var(--c-text-primary, #0f172a);
}

.popup-kv-table tr:last-child th,
.popup-kv-table tr:last-child td {
    border-bottom: none;
}

.detail-section {
    margin-bottom: 10px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    overflow: hidden;
}

.detail-section summary {
    list-style: none;
    cursor: pointer;
    padding: 9px 12px;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .35px;
    color: var(--c-text-secondary);
    background: #f8fafc;
    border-bottom: 1px solid var(--c-border-light);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.detail-section summary::-webkit-details-marker {
    display: none;
}

.detail-section summary::before {
    content: '▸';
    font-size: 12px;
    margin-right: 6px;
    color: var(--c-text-muted);
}

.detail-section[open] summary::before {
    content: '▾';
}

.detail-section summary .summary-title {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
}

.detail-section summary .summary-meta {
    font-size: 11px;
    color: var(--c-text-muted);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    white-space: nowrap;
}

.section-body {
    padding: 0;
}

.collection-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--c-border-light);
    background: #fbfcff;
    font-size: 12px;
    color: var(--c-text-secondary);
}

.collection-pager {
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.collection-pager button {
    height: 24px;
    min-width: 24px;
    border: 1px solid var(--c-border);
    border-radius: 6px;
    background: #fff;
    color: var(--c-text-secondary);
    cursor: pointer;
    padding: 0 6px;
    font-size: 12px;
}

.collection-pager button:disabled {
    opacity: .45;
    cursor: default;
}

@media (max-width: 640px) {
    .condition-main {
        flex-wrap: wrap;
    }

    .condition-main .field-picker,
    .condition-main .operator-select,
    .condition-main .value-input {
        min-width: 100%;
    }

    .field-label {
        flex: 0 0 120px;
    }

    .field-pair {
        grid-template-columns: 1fr;
    }

    .field-pair .field-row:first-child {
        border-right: none;
        border-bottom: 1px solid var(--c-border-light);
    }
}

/* ── Layout Designer Detail View ─────────────────────────────────── */

.layout-columns {
    display: grid;
    gap: 0;
    margin: 0;
}

.layout-column {
    padding: 0 4px;
    min-width: 0;
}

.layout-column:not(:last-child) {
    border-right: 1px solid var(--c-border-light);
}

.layout-divider {
    border: none;
    border-top: 2px solid var(--c-border);
    margin: 36px 0;
}

.layout-section-title {
    font-weight: 600;
    font-size: 0.95rem;
}

/* ── Field Style Classes ─────────────────────────────────────────── */

.field-h1 .field-label {
    font-size: 14px;
}

.field-h1 .field-value {
    font-size: 1.5rem;
    font-weight: 700;
}

.field-h2 .field-label {
    font-size: 13px;
}

.field-h2 .field-value {
    font-size: 1.25rem;
    font-weight: 600;
}

.field-h3 .field-value {
    font-size: 1.1rem;
    font-weight: 600;
}

.field-h4 .field-value {
    font-size: 0.95rem;
    font-weight: 600;
}

.field-small .field-label {
    font-size: 10px;
}

.field-small .field-value {
    font-size: 0.75rem;
}

.field-caption .field-label {
    font-size: 10px;
    font-style: italic;
}

.field-caption .field-value {
    font-size: 0.75rem;
    font-style: italic;
    color: var(--c-text-muted);
}

/* ── Enhanced Visual Depth ───────────────────────────────────────── */

.detail-section {
    margin-bottom: 36px;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    background: var(--c-surface);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
}

.detail-section[open] {
    /* no accent border */
}

.detail-section summary {
    list-style: none;
    padding: 10px 14px;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #ffffff;
    cursor: pointer;
    border-bottom: 1px solid var(--c-border-light);
    background: linear-gradient(135deg, #4f6ef7 0%, #3b5ce0 100%);
    border-radius: var(--radius) var(--radius) 0 0;
    justify-content: flex-start;
}

.detail-section summary:hover {
    background: linear-gradient(135deg, #4565e6 0%, #3352d0 100%);
}

/* ── Nested section depth styling ───────────────────────────────── */
/* Level 2: slightly lighter, reduced font, left accent */
.detail-section .section-body>.detail-section>summary {
    background: linear-gradient(135deg, #6b84f5 0%, #5a73e8 100%);
    font-size: 12px;
    padding: 8px 14px;
    border-left: 3px solid rgba(255, 255, 255, .35);
}

.detail-section .section-body>.detail-section>summary:hover {
    background: linear-gradient(135deg, #5f7af0 0%, #4e68e0 100%);
}

/* Level 3+: even lighter, more compact */
.detail-section .section-body>.detail-section .section-body>.detail-section>summary {
    background: linear-gradient(135deg, #8498f3 0%, #7489ec 100%);
    font-size: 11px;
    padding: 7px 14px;
    border-left: 5px solid rgba(255, 255, 255, .3);
}

.detail-section .section-body>.detail-section .section-body>.detail-section>summary:hover {
    background: linear-gradient(135deg, #7a8ff0 0%, #6a7fe8 100%);
}

/* Nested sections: reduce outer margin and shadow for compactness */
.detail-section .section-body>.detail-section {
    margin-bottom: 12px;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

.detail-section .section-body>.detail-section .section-body>.detail-section {
    margin-bottom: 6px;
    box-shadow: none;
    border-color: var(--c-border-light);
}

/* ── Inline sub-section (nested embedded entity inside a field row) ── */
.inline-subsection {
    width: 100%;
}

.inline-subsection summary {
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    color: var(--c-primary, #4f6ef7);
    list-style: none;
    padding: 2px 0;
    user-select: none;
}

.inline-subsection summary::-webkit-details-marker {
    display: none;
}

.inline-subsection summary::before {
    content: '\25B6';
    display: inline-block;
    font-size: 9px;
    margin-right: 6px;
    transition: transform 0.15s ease;
}

.inline-subsection[open] summary::before {
    transform: rotate(90deg);
}

.inline-subsection-body {
    margin-top: 4px;
    border-left: 2px solid var(--c-border, #dde1e9);
    padding-left: 8px;
}

.inline-subsection-body .field-row {
    min-height: 28px;
}

.inline-subsection-body .field-label {
    flex: 0 0 180px;
    font-size: 11px;
    padding: 4px 10px;
}

.inline-subsection-body .field-value {
    font-size: 12px;
    padding: 4px 10px;
}

.detail-section summary .summary-meta {
    font-size: 11px;
    color: rgba(255, 255, 255, .7);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
    white-space: nowrap;
    margin-left: auto;
}

.detail-section summary::before {
    color: rgba(255, 255, 255, .6);
}

.field-row {
    display: flex;
    border-bottom: 1px solid var(--c-border-light);
    min-height: 34px;
    align-items: baseline;
}

.field-row:nth-child(even) {
    background: #f7f9fc;
}

.field-label {
    flex: 0 0 240px;
    padding: 8px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--c-text-secondary);
    background: #eef1f6;
}

.field-label[title] {
    cursor: help;
}

.field-value {
    flex: 1;
    padding: 8px 16px;
    font-size: 13px;
    word-break: break-word;
}

.badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
}

.collection-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
}

.collection-table thead th {
    text-align: left;
    background: linear-gradient(to bottom, #ebeef5, #e2e7f0);
    padding: 8px 12px;
    border-bottom: 2px solid var(--c-border);
    border-right: 1px solid var(--c-border);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--c-text-secondary);
    cursor: pointer;
    user-select: none;
    position: relative;
    transition: background .15s;
}
.collection-table thead th:last-child { border-right: none; }

.collection-table thead th:hover {
    background: #dde2ec;
}

/* Group header spanning multiple sub-columns (column-expansion feature) */
.collection-table thead th.col-group {
    text-align: center;
    border-bottom: 1px solid var(--c-border);
    background: linear-gradient(to bottom, #dde2ec, #d4dae8);
}

.collection-table thead th .sort-indicator {
    font-size: 10px;
    margin-left: 4px;
    opacity: .5;
}

.collection-table thead th .sort-indicator.active {
    opacity: 1;
    color: var(--c-primary);
}

.collection-table tbody td {
    padding: 6px 12px;
    border-bottom: 1px solid var(--c-border-light);
    border-right: 1px solid var(--c-border-light);
}
.collection-table tbody td:last-child { border-right: none; }

.collection-table tbody tr:hover {
    background: rgba(59, 130, 246, 0.07);
}

/* Detail sheet enhanced header (layout mode) */
.detail-header {
    padding: 20px 24px;
    background: linear-gradient(to bottom, var(--c-surface), rgba(248, 250, 252, 1));
    border-bottom: 2px solid var(--c-border);
}

.detail-header h2 {
    margin: 0;
    font-size: 18px;
}

.detail-header .detail-header-title {
    margin: 0 0 4px 0;
    font-size: 24px;
    font-weight: 700;
    line-height: 1.2;
}

/* ── Auto-columnization ──────────────────────────────────────────── */

.field-columns-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
}

.field-columns-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0;
}

.field-columns-2>.field-row,
.field-columns-3>.field-row {
    flex-direction: column;
    border-bottom: 1px solid var(--c-border-light);
    border-right: 1px solid var(--c-border-light);
    min-height: 0;
}

.field-columns-2>.field-row .field-label,
.field-columns-3>.field-row .field-label {
    flex: none;
    padding: 6px 12px 2px;
    font-size: 10px;
    background: transparent;
}

.field-columns-2>.field-row .field-value,
.field-columns-3>.field-row .field-value {
    padding: 2px 12px 8px;
    font-size: 13px;
}

.field-group-subtitle {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--c-text-muted);
    padding: 8px 14px 4px;
    border-bottom: 1px solid var(--c-border-light);
}

.summary-title[title],
.field-group-subtitle[title] {
    cursor: help;
}

.field-group-subtitle.ref-subtitle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
}

.ref-link {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    text-decoration: none;
    color: var(--c-primary);
    opacity: 0.6;
    font-size: 11px;
    font-weight: 400;
    text-transform: none;
    letter-spacing: 0;

    padding: 1px 4px;

.ref-link:hover {

    background: rgba(var(--c-primary-rgb, 79, 70, 229), 0.08);
}

.ref-id-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 12px;
    border: none;
    border-radius: 5px;
    background: #1E4C7C;
    color: #fff;
    text-decoration: none;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.4;
    transition: background 0.15s, box-shadow 0.15s;

.ref-id-link:hover {

.ref-btn-icon {

.ref-id-link:hover .ref-btn-icon {

.field-empty-group {

    border: 1px solid var(--c-border-light);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
}

.field-empty-group .field-row {
    min-height: 28px;
    opacity: .6;
}

.field-empty-group .field-row .field-label {
    font-size: 11px;
    padding: 4px 12px;
    background: transparent;
}

.field-empty-group .field-row .field-value {
    padding: 4px 12px;
    font-size: 12px;
}

@media (max-width: 900px) {
    .field-columns-3 {
        grid-template-columns: 1fr 1fr;
    }
}

@media (max-width: 640px) {

    .field-columns-2,
    .field-columns-3 {
        grid-template-columns: 1fr;
    }
}

/* Tabs — vertical sidebar layout */
.layout-tabs {
    margin: 36px 0;
    display: flex;
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--c-surface);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.07);
}

.layout-tabs-header {
    font-weight: 600;
    font-size: 0.95rem;
    padding: 8px 12px 4px;
    color: var(--c-text-muted);
}

.tab-bar {
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    min-width: 160px;
    max-width: 220px;
    background: #f0f2f8;
    border-right: 1px solid var(--c-border);
    padding: 6px 0;
    gap: 2px;
}

.tab-bar button {
    background: none;
    border: none;
    border-left: 3px solid transparent;
    padding: 9px 14px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--c-text-secondary);
    cursor: pointer;
    text-align: left;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    line-height: 1.3;
}

.tab-bar button:hover {
    background: rgba(79, 70, 229, 0.06);
    color: var(--c-primary);
}

.tab-bar button.active {
    color: var(--c-primary);
    background: rgba(79, 70, 229, 0.10);
    border-left-color: var(--c-primary);
    font-weight: 600;
}

.tab-panel {
    display: none;
    padding: 8px 12px;
    flex: 1;
    min-width: 0;
    overflow-x: auto;

.back-ref-header {

    display: inline-block;
    margin-left: 6px;

    border-radius: 10px;

    font-size: 11px;
    font-weight: 500;
    vertical-align: middle;
}

.back-ref-list {
    padding: 0 8px;
}

.back-ref-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 5px 6px;
    border-bottom: 1px solid var(--c-border-light);

}

.back-ref-row:last-child {
    border-bottom: none;
}

.back-ref-id {
    flex: 0 0 auto;
    min-width: 60px;

    color: var(--c-text-muted);
    font-size: 12px;
}

.back-ref-summary {
    flex: 1;
    color: var(--c-text);

    text-overflow: ellipsis;

.back-ref-no-summary {

/* ── C: Boolean field toggle ──────────────────────────────────── */
.field-bool {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
}

.field-bool .bool-icon {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.field-bool.on .bool-icon {
    background: var(--c-primary);
}

.field-bool.off .bool-icon {
    border: 2px solid #c5cedb;
    background: transparent;
}

.field-bool.off {
    color: var(--c-text-muted);
}

/* ── D: Status badge color variants ──────────────────────────── */
.badge-active {
    background: #dcfce7;
    color: #14532d;
}

.badge-inactive {
    background: #f1f5f9;
    color: #475569;
}

.badge-warning {
    background: #fef9c3;
    color: #713f12;
}

.badge-danger-s {
    background: #fee2e2;
    color: #7f1d1d;
}

.badge-info {
    background: #dbeafe;
    color: #1e3a8a;
}

.badge-neutral {
    background: var(--c-border-light);
    color: var(--c-text-secondary);
}

/* ── A: field-box — titled bordered sub-group ────────────────── */
.field-box {
    border: 1.5px solid var(--c-border);
    border-radius: var(--radius-lg);
    margin-bottom: 14px;
    position: relative;
    background: var(--c-surface);
    box-shadow: var(--shadow-sm);
    padding-top: 10px;
}

.field-box-title {
    position: absolute;
    top: -10px;
    left: 14px;
    background: var(--c-surface);
    padding: 0 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--c-text-secondary);
    white-space: nowrap;
    border-radius: 4px;
}

.field-box-body {
    overflow: hidden;
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
}

/* ── B: field-memo — large text / memo display ───────────────── */
.field-memo {
    padding: 0 0 8px;
}

.field-memo-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--c-text-secondary);
    padding: 10px 16px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.field-memo-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--c-border-light);
}

.field-memo-body {
    margin: 0 12px 4px;
    padding: 12px 14px;
    background: #f8fafc;
    border: 1px solid var(--c-border-light);
    border-radius: var(--radius);
    font-size: 13px;
    color: var(--c-text);
    line-height: 1.65;
    min-height: 68px;
    white-space: pre-wrap;
}

.field-memo-body.empty {
    color: var(--c-text-muted);
    font-style: italic;
}

/* ── E: info-block — contextual description panel ────────────── */
.info-block {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: #eef4ff;
    border: 1px solid #c7d7f8;
    border-left: 4px solid var(--c-primary);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
    font-size: 13px;
    line-height: 1.65;
    color: var(--c-text-secondary);

.info-block-icon {

    text-decoration: underline;

/* ── F: table-stack — stacked labeled collection tables ─────── */
