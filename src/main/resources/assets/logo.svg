<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-label="Migration4o logo">
  <defs>
    <linearGradient id="gPrimary" x1="40" y1="20" x2="240" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Icon container -->
  <rect x="20" y="20" width="220" height="220" rx="52" fill="#0B1220"/>

  <!-- Icon -->
  <g transform="translate(0,0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Database -->
    <g stroke="url(#gPrimary)" stroke-width="10">
      <ellipse cx="102" cy="86" rx="34" ry="14"/>
      <path d="M68 86v58c0 7.7 15.2 14 34 14s34-6.3 34-14V86"/>
      <path d="M68 116c0 7.7 15.2 14 34 14s34-6.3 34-14"/>
      <path d="M68 144c0 7.7 15.2 14 34 14s34-6.3 34-14"/>
    </g>

    <!-- Migration arrows -->
    <g stroke="#A7F3D0" stroke-width="10">
      <path d="M130 104c18-18 46-18 64 0"/>
      <path d="M195 104l-8-8m8 8l-10 2"/>
      <path d="M194 168c-18 18-46 18-64 0"/>
      <path d="M130 168l8 8m-8-8l10-2"/>
    </g>

    <!-- Brackets -->
    <g stroke="url(#gPrimary)" stroke-width="10">
      <path d="M210 116l-22 20 22 20"/>
      <path d="M234 116l22 20-22 20"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g transform="translate(270,0)">
    <text x="0" y="130"
          font-family="ui-sans-serif, system-ui, Helvetica, Arial, sans-serif"
          font-size="78"
          font-weight="700"
          fill="#0B1220">
      Migration<tspan fill="#2563EB">4o</tspan>
    </text>

    <text x="2" y="178"
          font-family="ui-sans-serif, system-ui, Helvetica, Arial,  sans-serif"
          font-size="28"
          font-weight="500"
          fill="#334155">
       © Gestion Technologies
    </text>
  </g>
</svg>
