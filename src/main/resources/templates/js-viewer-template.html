<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="__BASE_HREF__">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__TITLE__ — JS Data Viewer</title>
    <style>
        :root {
            color-scheme: light;
            --c-bg: #f4f6f9;
            --c-surface: #ffffff;
            --c-border: #e0e5ec;
            --c-border-light: #edf0f5;
            --c-text: #1b2532;
            --c-text-secondary: #5a6678;
            --c-text-muted: #8793a4;
            --c-primary: #3b6cf5;
            --c-primary-hover: #2a56d4;
            --c-primary-light: #eaf0ff;
            --c-danger: #ef4444;
            --c-danger-light: #fef2f2;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
            --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--c-bg);
            color: var(--c-text);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .app-header {
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .app-header .logo {
            width: 32px;
            height: 32px;
            background: var(--c-primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: -.3px;
            color: var(--c-text);
        }

        .app-header .file-badge {
            margin-left: auto;
            font-size: 12px;
            color: var(--c-text-muted);
            background: var(--c-bg);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--c-border);
        }

        .lang-select,
        .columns-btn {
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            color: var(--c-text-secondary);
            font-size: 12px;
            font-family: var(--font);
        }

        .app-body {
            display: block;
            flex: 1;
            overflow: hidden;
            padding: 0 16px 16px;
        }

        .panel-left {
            width: 100%;
            display: flex;
            flex-direction: column;
            border-right: none;
            background: var(--c-surface);
            min-width: 0;
            border: 1px solid var(--c-border);
            border-radius: var(--radius-lg);
            margin-top: 14px;
            overflow: hidden;
        }

        .entity-header {
            padding: 16px 20px 14px;
            border-bottom: 1px solid var(--c-border);
            background: var(--c-surface);
        }

        .entity-title {
            font-size: 20px;
            font-weight: 700;
            color: var(--c-text);
            line-height: 1.2;
        }

        .search-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--c-border);
        }

        .search-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .search-header h2 {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--c-text-secondary);
        }

        .search-tools {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .columns-menu-wrap {
            position: relative;
        }

        .columns-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 320px;
            max-height: 280px;
            overflow: auto;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            box-shadow: var(--shadow);
            padding: 8px;
            z-index: 50;
            display: none;
        }

        .columns-menu.open {
            display: block;
        }

        .columns-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 6px;
            border-radius: 6px;
            font-size: 12px;
        }

        .columns-item:hover {
            background: #f6f8fc;
        }

        .search-actions {
            display: flex;
            gap: 6px;
        }

        .search-condition {
            margin-bottom: 8px;
        }

        .condition-main {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .search-condition .logic-label {
            min-width: 34px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--c-primary);
            text-transform: uppercase;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            background: var(--c-primary-light);
            border: 1px solid transparent;
            transition: all .15s;
            user-select: none;
        }

        .search-condition .logic-label.first {
            visibility: hidden;
        }

        .search-condition select,
        .search-condition input[type="text"] {
            height: 32px;
            padding: 0 8px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            font-size: 13px;
            font-family: var(--font);
            background: var(--c-surface);
            color: var(--c-text);
        }

        .condition-main .field-select {
            flex: 2;
            min-width: 130px;
        }

        .condition-main .field-filter {
            flex: 0 0 120px;
            min-width: 90px;
            max-width: 140px;
        }

        .condition-main .operator-select {
            flex: 1;
            min-width: 90px;
        }

        .condition-main .value-input {
            flex: 2;
            min-width: 110px;
        }

        .search-condition .remove-btn {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            font-size: 16px;
            color: var(--c-text-muted);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            flex-shrink: 0;
        }

        .search-condition .remove-btn:hover {
            background: var(--c-danger-light);
            color: var(--c-danger);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            background: var(--c-surface);
            color: var(--c-text-secondary);
            transition: all .15s;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--c-bg);
            border-color: #ccd3dd;
        }

        .btn-primary {
            background: var(--c-primary);
            color: #fff;
            border-color: var(--c-primary);
        }

        .btn-primary:hover {
            background: var(--c-primary-hover);
            border-color: var(--c-primary-hover);
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        .results-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .results-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--c-border-light);
            font-size: 12px;
            color: var(--c-text-secondary);
            background: #fafbfd;
        }

        .results-count {
            font-weight: 600;
        }

        .results-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table thead th {
            position: sticky;
            top: 0;
            background: #fafbfd;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--c-text-muted);
            padding: 8px 14px;
            border-bottom: 1px solid var(--c-border);
            z-index: 2;
            white-space: nowrap;
        }

        .results-table tbody td {
            padding: 8px 14px;
            font-size: 13px;
            border-bottom: 1px solid var(--c-border-light);
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .results-table tbody tr {
            cursor: pointer;
            transition: background .1s;
        }

        .results-table tbody tr:hover {
            background: #f5f8ff;
        }

        .results-table tbody tr.active {
            background: var(--c-primary-light);
            border-left: 3px solid var(--c-primary);
        }

        .results-empty,
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: var(--c-text-muted);
            text-align: center;
        }

        .results-empty .icon,
        .welcome .icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: .45;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-top: 1px solid var(--c-border);
            background: #fafbfd;
            font-size: 12px;
            color: var(--c-text-secondary);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination button,
        .pagination select {
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            font-size: 12px;
            font-family: var(--font);
            color: var(--c-text);
            cursor: pointer;
        }

        .pagination button:disabled {
            opacity: .4;
            cursor: default;
        }

        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .45);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 200;
            padding: 24px;
        }

        .detail-overlay.open {
            display: flex;
        }

        .detail-sheet {
            width: min(1500px, calc(100vw - 48px));
            height: min(94vh, calc(100vh - 56px));
            background: var(--c-bg);
            border-radius: 16px;
            border: 1px solid var(--c-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 12px 32px rgba(0, 0, 0, .24);
        }

        .detail-sheet-top {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
        }

        .detail-drag {
            width: 42px;
            height: 4px;
            border-radius: 2px;
            background: #c5cfdd;
            margin: 0 auto;
        }

        .detail-close {
            border: 1px solid var(--c-border);
            background: var(--c-surface);
            color: var(--c-text-secondary);
            border-radius: 8px;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .detail-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 32px;
        }

        .detail-header {
            padding: 16px 20px;
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
        }

        .detail-header h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .detail-header .detail-subtitle {
            font-size: 12px;
            color: var(--c-text-secondary);
        }

        .field-group {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .field-group-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--c-text-secondary);
            padding: 10px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--c-border-light);
        }

        .field-row {
            display: flex;
            border-bottom: 1px solid var(--c-border-light);
            min-height: 34px;
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--c-border-light);
        }

        .field-pair:last-child {
            border-bottom: none;
        }

        .field-pair .field-row {
            border-bottom: none;
        }

        .field-pair .field-row:first-child {
            border-right: 1px solid var(--c-border-light);
        }

        .field-label {
            flex: 0 0 240px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--c-text-secondary);
            background: #fcfcfe;
            word-break: break-word;
        }

        .field-value {
            flex: 1;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--c-text);
            word-break: break-word;
            min-width: 0;
            white-space: pre-wrap;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-id {
            background: #fef3c7;
            color: #92400e;
            font-family: var(--font-mono);
        }

        .badge-number {
            background: #e0e7ff;
            color: #3730a3;
            font-family: var(--font-mono);
        }

        .badge-true {
            background: #dcfce7;
            color: #166534;
        }

        .badge-false {
            background: #fee2e2;
            color: #991b1b;
        }

        .collection-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            overflow: hidden;
            font-size: 12px;
        }

        .collection-table th {
            background: #f5f7fa;
            font-size: 11px;
            font-weight: 700;
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--c-border);
            color: var(--c-text-secondary);
        }

        .collection-table td {
            padding: 5px 10px;
            border-bottom: 1px solid var(--c-border-light);
            vertical-align: top;
        }

        .collection-table tr:last-child td {
            border-bottom: none;
        }

        .detail-section {
            margin-bottom: 10px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            overflow: hidden;
        }

        .detail-section summary {
            list-style: none;
            cursor: pointer;
            padding: 9px 12px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .35px;
            color: var(--c-text-secondary);
            background: #f8fafc;
            border-bottom: 1px solid var(--c-border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .detail-section summary::-webkit-details-marker {
            display: none;
        }

        .detail-section summary::before {
            content: '▸';
            font-size: 12px;
            margin-right: 6px;
            color: var(--c-text-muted);
        }

        .detail-section[open] summary::before {
            content: '▾';
        }

        .detail-section summary .summary-title {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .detail-section summary .summary-meta {
            font-size: 11px;
            color: var(--c-text-muted);
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .section-body {
            padding: 0;
        }

        .collection-toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid var(--c-border-light);
            background: #fbfcff;
            font-size: 12px;
            color: var(--c-text-secondary);
        }

        .collection-pager {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .collection-pager button {
            height: 24px;
            min-width: 24px;
            border: 1px solid var(--c-border);
            border-radius: 6px;
            background: #fff;
            color: var(--c-text-secondary);
            cursor: pointer;
            padding: 0 6px;
            font-size: 12px;
        }

        .collection-pager button:disabled {
            opacity: .45;
            cursor: default;
        }

        @media (max-width: 640px) {
            .condition-main {
                flex-wrap: wrap;
            }

            .condition-main .field-select,
            .condition-main .operator-select,
            .condition-main .value-input {
                min-width: 100%;
            }

            .field-label {
                flex: 0 0 120px;
            }

            .field-pair {
                grid-template-columns: 1fr;
            }

            .field-pair .field-row:first-child {
                border-right: none;
                border-bottom: 1px solid var(--c-border-light);
            }
        }

        /* ─── Navigation sidebar ─────────────────────────────────── */
        .nav-toggle-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            color: var(--c-text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
            line-height: 1;
            transition: background .15s;
            padding: 0;
        }

        .nav-toggle-btn:hover {
            background: var(--c-bg);
        }

        .app-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            min-height: 0;
        }

        /* ── Navigation sidebar ─────────────────────────────────────────── */

        .nav-sidebar {
            width: 264px;
            min-width: 264px;
            background: #edf1f7;
            border-right: 1px solid var(--c-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: width .22s ease, min-width .22s ease;
            flex-shrink: 0;
        }

        .nav-sidebar.collapsed {
            width: 0;
            min-width: 0;
        }

        .nav-sidebar-header {
            padding: 12px 14px 10px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .9px;
            color: var(--c-text-muted);
            border-bottom: 1px solid rgba(0, 0, 0, .07);
            white-space: nowrap;
            overflow: hidden;
            flex-shrink: 0;
        }

        .nav-sidebar-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0 20px;
        }

        /* Module group toggles */
        .nav-group-toggle {
            width: 100%;
            border: none;
            cursor: pointer;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 9px;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-right: 10px;
            /* padding-left set dynamically by JS */
            font-family: var(--font);
            font-size: 13px;
            font-weight: 600;
            color: var(--c-text);
            background: transparent;
            transition: background .12s, color .12s;
            white-space: nowrap;
            overflow: hidden;
        }

        /* Top-level (depth=0) module — larger, more dominant */
        .nav-group-toggle.nav-group-top {
            padding-top: 9px;
            padding-bottom: 9px;
            font-size: 13.5px;
        }

        .nav-group-toggle:hover {
            background: rgba(0, 0, 0, .06);
        }

        .nav-group-toggle.open {
            color: var(--c-primary);
        }

        .nav-group-icon {
            font-size: 18px;
            flex-shrink: 0;
            line-height: 1;
            width: 24px;
            text-align: center;
        }

        .nav-group-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-chevron {
            font-size: 8px;
            flex-shrink: 0;
            transition: transform .15s;
            color: var(--c-text-muted);
            margin-left: auto;
            padding-right: 2px;
        }

        .nav-group-toggle.open>.nav-chevron {
            transform: rotate(90deg);
        }

        .nav-group-children {
            overflow: hidden;
            max-height: 0;
        }

        .nav-group-children.open {
            max-height: 9999px;
        }

        /* Class leaf items */
        .nav-item-link {
            display: flex;
            align-items: center;
            gap: 7px;
            text-decoration: none;
            overflow: hidden;
            /* padding-left set dynamically by JS */
            padding-top: 5px;
            padding-bottom: 5px;
            padding-right: 10px;
            border-left: 3px solid transparent;
            font-size: 12px;
            color: var(--c-text-secondary);
            transition: background .1s, color .1s;
        }

        .nav-item-icon {
            flex-shrink: 0;
            width: 16px;
            text-align: center;
            font-size: 12px;
            color: var(--c-text-muted);
            opacity: .7;
        }

        .nav-item-label {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .nav-item-link:hover {
            background: rgba(0, 0, 0, .06);
            color: var(--c-text);
        }

        .nav-item-link.nav-current {
            background: var(--c-primary-light);
            color: var(--c-primary);
            border-left-color: var(--c-primary);
            font-weight: 600;
        }

        .nav-item-link.nav-current .nav-item-icon {
            color: var(--c-primary);
            opacity: 1;
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="app-header">
            <button class="nav-toggle-btn" id="navToggleBtn" type="button" title="Navigation" aria-label="Toggle navigation">&#9776;</button>
            <div class="logo">M</div>

    <script>
