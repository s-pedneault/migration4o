<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <base href="__BASE_HREF__">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__TITLE__ — JS Data Viewer</title>
    <style>
        __SIDEBAR_CSS__
    </style>
</head>

<body class="viewer-page">
    <div class="app">
        <nav class="nav-sidebar" id="navSidebar" aria-label="Module navigation">
            <!-- Header -->
            <div class="sidebar-head">
                <a class="sidebar-brand" href="__BASE_HREF__" title="Accueil">
                    <div class="sidebar-logo">M</div>
                    <span class="sidebar-name">Migration4O</span>
                </a>
                <button class="sidebar-toggle" id="navToggleBtn" type="button" title="Réduire / Agrandir" aria-label="Toggle navigation"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12h18" />
                        <path d="M3 6h18" />
                        <path d="M3 18h18" />
                    </svg></button>
            </div>
            <!-- Nav items -->
            <div class="sidebar-nav" id="navSidebarScroll"></div>
            <!-- Footer -->
            <div class="sidebar-foot">
                <div class="sidebar-foot-row">
                    <span class="sidebar-foot-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10" />
                            <path d="M2 12h20" />
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
                        </svg></span>
                    <select id="languageSelect" class="lang-select" aria-label="Language">
                        <option value="fr" selected>Français</option>
                        <option value="en">English</option>
                    </select>
                </div>
                <div class="sidebar-foot-row">
                    <span class="sidebar-foot-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                            <path d="M14 2v6h6" />
                        </svg></span>
                    <span class="sidebar-badge-text" title="__TITLE__">__TITLE__</span>
                </div>
            </div>
        </nav>

        <div class="app-main">
            <div class="app-body">
                <div class="panel-left">
                    <div class="entity-header">
                        <h2 class="entity-title">__ENTITY_NAME__</h2>
                    </div>
                    <div class="search-section">
                        <div class="search-header">
                            <h2 id="searchTitle">Recherche</h2>
                            <div class="search-tools">
                                <div class="search-actions">
                                    <button class="btn btn-sm" id="addConditionBtn" type="button">+ Critère</button>
                                    <button class="btn btn-sm" id="clearSearchBtn" type="button">Effacer</button>
                                    <button class="btn btn-sm btn-primary" id="searchBtn" type="button">Appliquer</button>
                                </div>
                            </div>
                        </div>
                        <div id="conditionsContainer"></div>
                    </div>
                    <div class="results-section">
                        <div class="results-bar">
                            <span class="results-count" id="resultsCount">Chargement...</span>
                            <div class="pagination-controls">
                                <label id="rowsLabel">Lignes :</label>
                                <select id="pageSizeSelect">
                                    <option value="25">25</option>
                                    <option value="50" selected>50</option>
                                    <option value="100">100</option>
                                    <option value="200">200</option>
                                </select>
                                <div class="columns-menu-wrap">
                                    <button class="columns-btn" id="columnsBtn" type="button">Colonnes</button>
                                    <div class="columns-menu" id="columnsMenu"></div>
                                </div>
                            </div>
                        </div>
                        <div class="results-scroll" id="resultsScroll">
                            <table class="results-table">
                                <thead id="resultsHead"></thead>
                                <tbody id="resultsBody"></tbody>
                            </table>
                        </div>
                        <div class="pagination">
                            <div class="pagination-controls">
                                <button id="prevBtn" type="button">&#8592; Préc.</button>
                                <span id="pageInfo">Page 1 / 1</span>
                                <button id="nextBtn" type="button">Suiv. &#8594;</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="detail-overlay" id="detailOverlay" aria-hidden="true">
        <div class="detail-sheet">
            <div class="detail-sheet-top">
                <div class="detail-drag"></div>
                <button class="detail-close" id="detailCloseBtn" type="button" aria-label="Close">✕</button>
            </div>
            <div id="detailContainer" class="detail-scroll"></div>
        </div>
    </div>

    <script>var NAV_ITEMS = __NAV_ITEMS__;</script>
    <script>var DETAIL_LAYOUT = __DETAIL_LAYOUT__;</script>
    <script>__EMBEDDED_JS_DATA__</script>
    <script>var entityName = '__ENTITY_NAME__';</script>
    <script>__SIDEBAR_NAV_JS__</script>
</body>

</html>
