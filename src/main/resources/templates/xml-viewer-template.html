<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>__TITLE__ — Data Viewer</title>
    <style>
        :root {
            color-scheme: light;
            --c-bg: #f4f6f9;
            --c-surface: #ffffff;
            --c-border: #e0e5ec;
            --c-border-light: #edf0f5;
            --c-text: #1b2532;
            --c-text-secondary: #5a6678;
            --c-text-muted: #8793a4;
            --c-primary: #3b6cf5;
            --c-primary-hover: #2a56d4;
            --c-primary-light: #eaf0ff;
            --c-accent: #10b981;
            --c-danger: #ef4444;
            --c-danger-light: #fef2f2;
            --radius: 8px;
            --radius-lg: 12px;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .04);
            --shadow: 0 1px 3px rgba(0, 0, 0, .06), 0 1px 2px rgba(0, 0, 0, .04);
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            background: var(--c-bg);
            color: var(--c-text);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
        }

        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .app-header {
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .app-header .logo {
            width: 32px;
            height: 32px;
            background: var(--c-primary);
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 16px;
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 17px;
            font-weight: 700;
        }

        .app-header .file-badge {
            margin-left: auto;
            font-size: 12px;
            color: var(--c-text-muted);
            background: var(--c-bg);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--c-border);
        }

        .app-body {
            display: block;
            flex: 1;
            overflow: hidden;
            padding: 0 16px 16px;
        }

        .panel-left {
            width: 100%;
            display: flex;
            flex-direction: column;
            border-right: none;
            background: var(--c-surface);
            min-width: 0;
            border: 1px solid var(--c-border);
            border-radius: var(--radius-lg);
            margin-top: 14px;
            overflow: hidden;
        }

        .search-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--c-border);
        }

        .search-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .search-header h2 {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .5px;
            color: var(--c-text-secondary);
        }

        .search-actions {
            display: flex;
            gap: 6px;
        }

        .search-tools {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .lang-select,
        .columns-btn {
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            color: var(--c-text-secondary);
            font-size: 12px;
            font-family: var(--font);
        }

        .columns-menu-wrap {
            position: relative;
        }

        .columns-menu {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            width: 300px;
            max-height: 280px;
            overflow: auto;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            box-shadow: var(--shadow);
            padding: 8px;
            z-index: 50;
            display: none;
        }

        .columns-menu.open {
            display: block;
        }

        .columns-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 6px;
            border-radius: 6px;
            font-size: 12px;
        }

        .columns-item:hover {
            background: #f6f8fc;
        }

        .search-condition {
            margin-bottom: 8px;
        }

        .condition-main {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .condition-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
            padding-left: 40px;
        }

        .condition-sub .sub-label {
            font-size: 11px;
            color: var(--c-text-muted);
            white-space: nowrap;
        }

        .search-condition .logic-label {
            min-width: 34px;
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--c-primary);
            text-transform: uppercase;
            cursor: pointer;
            padding: 3px 5px;
            border-radius: 4px;
            background: var(--c-primary-light);
            border: 1px solid transparent;
            transition: all .15s;
            user-select: none;
        }

        .search-condition .logic-label:hover {
            border-color: var(--c-primary);
        }

        .search-condition .logic-label.first {
            visibility: hidden;
        }

        .search-condition select,
        .search-condition input[type="text"],
        .search-condition input[type="date"],
        .search-condition input[type="search"] {
            height: 32px;
            padding: 0 8px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            font-size: 13px;
            font-family: var(--font);
            background: var(--c-surface);
            color: var(--c-text);
            transition: border-color .15s, box-shadow .15s;
        }

        .search-condition select:focus,
        .search-condition input:focus {
            outline: none;
            border-color: var(--c-primary);
            box-shadow: 0 0 0 3px rgba(59, 108, 245, .12);
        }

        .search-condition select option {
            color: var(--c-text);
            background: var(--c-surface);
        }

        .condition-main .field-select {
            flex: 2;
            min-width: 130px;
        }

        .condition-main .operator-select {
            flex: 1;
            min-width: 90px;
        }

        .condition-main .value-input {
            flex: 2;
            min-width: 110px;
        }

        .condition-sub .sub-field-select {
            flex: 1;
        }

        .search-condition .remove-btn {
            width: 26px;
            height: 26px;
            border: none;
            background: none;
            font-size: 16px;
            color: var(--c-text-muted);
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all .15s;
            flex-shrink: 0;
        }

        .search-condition .remove-btn:hover {
            background: var(--c-danger-light);
            color: var(--c-danger);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 5px 10px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            background: var(--c-surface);
            color: var(--c-text-secondary);
            transition: all .15s;
            white-space: nowrap;
        }

        .btn:hover {
            background: var(--c-bg);
            border-color: #ccd3dd;
        }

        .btn-primary {
            background: var(--c-primary);
            color: #fff;
            border-color: var(--c-primary);
        }

        .btn-primary:hover {
            background: var(--c-primary-hover);
            border-color: var(--c-primary-hover);
        }

        .btn-sm {
            padding: 4px 8px;
            font-size: 11px;
        }

        .results-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .results-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-bottom: 1px solid var(--c-border-light);
            font-size: 12px;
            color: var(--c-text-secondary);
            background: #fafbfd;
        }

        .results-count {
            font-weight: 600;
        }

        .results-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
        }

        .results-table thead th {
            position: sticky;
            top: 0;
            background: #fafbfd;
            text-align: left;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--c-text-muted);
            padding: 8px 14px;
            border-bottom: 1px solid var(--c-border);
            z-index: 2;
            white-space: nowrap;
        }

        .results-table tbody td {
            padding: 8px 14px;
            font-size: 13px;
            border-bottom: 1px solid var(--c-border-light);
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .results-table tbody tr {
            cursor: pointer;
            transition: background .1s;
        }

        .results-table tbody tr:hover {
            background: #f5f8ff;
        }

        .results-table tbody tr.active {
            background: var(--c-primary-light);
            border-left: 3px solid var(--c-primary);
        }

        .results-table tbody tr.active td:first-child {
            padding-left: 11px;
        }

        .results-empty,
        .welcome {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 24px;
            color: var(--c-text-muted);
            text-align: center;
        }

        .results-empty .icon,
        .welcome .icon {
            font-size: 36px;
            margin-bottom: 12px;
            opacity: .45;
        }

        .results-empty p,
        .welcome p {
            font-size: 14px;
            max-width: 360px;
        }

        .results-empty .sub {
            font-size: 12px;
            margin-top: 6px;
        }

        .welcome h3 {
            font-size: 16px;
            color: var(--c-text-secondary);
            margin-bottom: 6px;
        }

        .pagination {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            border-top: 1px solid var(--c-border);
            background: #fafbfd;
            font-size: 12px;
            color: var(--c-text-secondary);
        }

        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pagination button,
        .pagination select {
            height: 28px;
            padding: 0 8px;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            background: var(--c-surface);
            font-size: 12px;
            font-family: var(--font);
            color: var(--c-text);
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--c-bg);
        }

        .pagination button:disabled {
            opacity: .4;
            cursor: default;
        }

        .pagination select {
            color: var(--c-text);
        }

        .detail-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .45);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
        }

        .detail-overlay.open {
            display: flex;
        }

        .detail-sheet {
            width: min(1280px, 100%);
            height: min(90vh, 920px);
            background: var(--c-bg);
            border-radius: 16px 16px 0 0;
            border: 1px solid var(--c-border);
            border-bottom: none;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 -8px 24px rgba(0, 0, 0, .18);
        }

        .detail-sheet-top {
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
        }

        .detail-drag {
            width: 42px;
            height: 4px;
            border-radius: 2px;
            background: #c5cfdd;
            margin: 0 auto;
        }

        .detail-close {
            border: 1px solid var(--c-border);
            background: var(--c-surface);
            color: var(--c-text-secondary);
            border-radius: 8px;
            width: 30px;
            height: 30px;
            cursor: pointer;
        }

        .detail-header {
            padding: 16px 20px;
            background: var(--c-surface);
            border-bottom: 1px solid var(--c-border);
        }

        .detail-header h2 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 2px;
        }

        .detail-header .detail-subtitle {
            font-size: 12px;
            color: var(--c-text-secondary);
        }

        .detail-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 32px;
        }

        .detail-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--c-text-muted);
            text-align: center;
            padding: 48px;
        }

        .detail-empty .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: .3;
        }

        .detail-empty p {
            font-size: 14px;
        }

        .field-group {
            background: var(--c-surface);
            border: 1px solid var(--c-border);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
        }

        .field-group-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .4px;
            color: var(--c-text-secondary);
            padding: 10px 16px;
            background: #f8fafc;
            border-bottom: 1px solid var(--c-border-light);
        }

        .field-row {
            display: flex;
            border-bottom: 1px solid var(--c-border-light);
            min-height: 36px;
        }

        .field-row:last-child {
            border-bottom: none;
        }

        .field-label {
            flex: 0 0 190px;
            padding: 8px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--c-text-secondary);
            background: #fcfcfe;
            display: flex;
            align-items: flex-start;
            word-break: break-word;
        }

        .field-value {
            flex: 1;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--c-text);
            word-break: break-word;
            white-space: pre-wrap;
            min-width: 0;
        }

        .field-value.empty {
            color: var(--c-text-muted);
            font-style: italic;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-true {
            background: #dcfce7;
            color: #166534;
        }

        .badge-false {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-number {
            background: #e0e7ff;
            color: #3730a3;
            font-family: var(--font-mono);
        }

        .badge-id {
            background: #fef3c7;
            color: #92400e;
            font-family: var(--font-mono);
        }

        .field-pair {
            display: grid;
            grid-template-columns: 1fr 1fr;
            border-bottom: 1px solid var(--c-border-light);
        }

        .field-pair:last-child {
            border-bottom: none;
        }

        .field-pair>.field-row {
            border-bottom: none;
        }

        .field-pair>.field-row:first-child {
            border-right: 1px solid var(--c-border-light);
        }

        .collection-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: #f0f4ff;
            color: var(--c-primary);
            margin-left: 6px;
        }

        .collection-table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            overflow: hidden;
            font-size: 12px;
        }

        .collection-table th {
            background: #f5f7fa;
            font-size: 11px;
            font-weight: 700;
            text-align: left;
            padding: 6px 10px;
            border-bottom: 1px solid var(--c-border);
            color: var(--c-text-secondary);
        }

        .collection-table td {
            padding: 5px 10px;
            border-bottom: 1px solid var(--c-border-light);
            vertical-align: top;
        }

        .collection-table tr:last-child td {
            border-bottom: none;
        }

        .collection-table tr:hover td {
            background: #f9fbff;
        }

        @media (max-width: 1100px) {
            .detail-sheet {
                height: 94vh;
            }
        }

        @media (max-width: 640px) {
            .condition-main {
                flex-wrap: wrap;
            }

            .condition-main .field-select,
            .condition-main .operator-select,
            .condition-main .value-input {
                min-width: 100%;
            }

            .condition-sub {
                padding-left: 0;
            }

            .field-label {
                flex: 0 0 110px;
            }

            .field-pair {
                grid-template-columns: 1fr;
            }

            .field-pair>.field-row:first-child {
                border-right: none;
                border-bottom: 1px solid var(--c-border-light);
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header class="app-header">
            <div class="logo">M</div>
            <h1>__ENTITY_NAME__</h1>
            <select id="languageSelect" class="lang-select" aria-label="Language">
                <option value="fr" selected>Français</option>
                <option value="en">English</option>
            </select>
            <span class="file-badge">__TITLE__</span>
        </header>
        <div class="app-body">
            <div class="panel-left">
                <div class="search-section">
                    <div class="search-header">
                        <h2 id="searchTitle">Recherche</h2>
                        <div class="search-tools">
                            <div class="columns-menu-wrap">
                                <button class="columns-btn" id="columnsBtn" type="button">Colonnes</button>
                                <div class="columns-menu" id="columnsMenu"></div>
                            </div>
                            <div class="search-actions">
                                <button class="btn btn-sm" id="addConditionBtn" type="button">+ Critère</button>
                                <button class="btn btn-sm" id="clearSearchBtn" type="button">Effacer</button>
                                <button class="btn btn-sm btn-primary" id="searchBtn" type="button">Appliquer</button>
                            </div>
                        </div>
                    </div>
                    <div id="conditionsContainer"></div>
                </div>
                <div class="results-section">
                    <div class="results-bar">
                        <span class="results-count" id="resultsCount">Chargement...</span>
                        <div class="pagination-controls">
                            <label id="rowsLabel">Lignes :</label>
                            <select id="pageSizeSelect">
                                <option value="25">25</option>
                                <option value="50" selected>50</option>
                                <option value="100">100</option>
                                <option value="200">200</option>
                            </select>
                        </div>
                    </div>
                    <div class="results-scroll" id="resultsScroll">
                        <table class="results-table">
                            <thead id="resultsHead"></thead>
                            <tbody id="resultsBody"></tbody>
                        </table>
                    </div>
                    <div class="pagination">
                        <div class="pagination-controls">
                            <button id="prevBtn" type="button">&#8592; Préc.</button>
                            <span id="pageInfo">Page 1 / 1</span>
                            <button id="nextBtn" type="button">Suiv. &#8594;</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="detail-overlay" id="detailOverlay" aria-hidden="true">
        <div class="detail-sheet">
            <div class="detail-sheet-top">
                <div class="detail-drag"></div>
                <button class="detail-close" id="detailCloseBtn" type="button" aria-label="Close">✕</button>
            </div>
            <div id="detailContainer" class="detail-empty">
                <div class="icon">&#128203;</div>
                <p id="detailEmptyText">Sélectionnez un enregistrement pour voir ses détails.</p>
            </div>
        </div>
    </div>

    <script>
        const embeddedXmlBase64 = '__XML_BASE64__';
        const entityName = '__ENTITY_NAME__';
        const SCHEMA_FIELDS = __SCHEMA_FIELDS__;

        let allRecords = [];
        let filteredRecords = [];
        let currentPage = 1;
        let selectedRecordKey = null;
        let searchApplied = false;
        let globalLogicOperator = 'AND';

        const conditionsContainer = document.getElementById('conditionsContainer');
        const addConditionBtn = document.getElementById('addConditionBtn');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const searchBtn = document.getElementById('searchBtn');
        const resultsCount = document.getElementById('resultsCount');
        const resultsHead = document.getElementById('resultsHead');
        const resultsBody = document.getElementById('resultsBody');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageSizeSelect = document.getElementById('pageSizeSelect');
        const detailContainer = document.getElementById('detailContainer');
        const detailOverlay = document.getElementById('detailOverlay');
        const detailCloseBtn = document.getElementById('detailCloseBtn');
        const languageSelect = document.getElementById('languageSelect');
        const columnsBtn = document.getElementById('columnsBtn');
        const columnsMenu = document.getElementById('columnsMenu');
        const searchTitle = document.getElementById('searchTitle');
        const rowsLabel = document.getElementById('rowsLabel');
        const detailEmptyText = document.getElementById('detailEmptyText');

        let currentLanguage = 'fr';
        let selectedColumns = ['__id', '__summary'];

        const I18N = {
            fr: {
                search: 'Recherche', columns: 'Colonnes', addCondition: '+ Critère', clear: 'Effacer', apply: 'Appliquer',
                rows: 'Lignes :', prev: '\u2190 Préc.', next: 'Suiv. \u2192', loading: 'Chargement...', detailEmpty: 'Sélectionnez un enregistrement pour voir ses détails.',
                allFields: 'Tous les champs', anyField: 'N’importe quel champ', in: '\u2514 Dans :', value: 'Valeur...', number: 'Nombre...', between: 'min, max',
                noResults: 'Aucun enregistrement ne correspond à vos critères.', noResultsSub: 'Essayez d’ajuster vos critères ou effacez la recherche.',
                browse: 'Parcourir tout', welcome: 'enregistrements', welcomeHint: 'Ajoutez des critères ci-dessus pour filtrer, ou parcourez tous les enregistrements.',

            nextBtn.disabled = currentPage >= tp;
        }

        function showAll() { searchApplied = true; renderResults(); }
        function openDetailOverlay() { detailOverlay.classList.add('open'); detailOverlay.setAttribute('aria-hidden', 'false'); }
        function closeDetailOverlay() { detailOverlay.classList.remove('open'); detailOverlay.setAttribute('aria-hidden', 'true'); }

        function applyLanguage() {
            searchTitle.textContent = t('search');
            columnsBtn.textContent = t('columns');
            columnsBtn.title = t('columnsHint');
            addConditionBtn.textContent = t('addCondition');
            clearSearchBtn.textContent = t('clear');
            searchBtn.textContent = t('apply');
            rowsLabel.textContent = t('rows');
            prevBtn.textContent = t('prev');
            nextBtn.textContent = t('next');
            detailEmptyText.textContent = t('detailEmpty');
            detailCloseBtn.setAttribute('aria-label', t('close'));
            renderColumnsMenu();

            document.querySelectorAll('.search-condition').forEach(function (row) {
                var fieldSel = row.querySelector('.field-select');
                var topField = fieldSel ? findTopField(fieldSel.value) : null;
                if (fieldSel) { var currentField = fieldSel.value; fieldSel.innerHTML = buildFieldOptions(); fieldSel.value = currentField; }
                var subDiv = row.querySelector('.condition-sub');
                var subSel = row.querySelector('.sub-field-select');
                if (subDiv && subSel && topField && topField.children) {
                    var currentSub = subSel.value;
                    subDiv.querySelector('.sub-label').textContent = t('in');
                    subSel.innerHTML = buildSubFieldOptions(topField);
                    subSel.value = currentSub;
                }
                var logicLabel = row.querySelector('.logic-label');
                if (logicLabel) logicLabel.title = t('toggleLogic');
                var removeBtn = row.querySelector('.remove-btn');
                if (removeBtn) removeBtn.title = t('remove');
                var opSel = row.querySelector('.operator-select');
                var valInput = row.querySelector('.value-input');
                if (opSel && valInput) updateValueInput(opSel, valInput, getFieldType(fieldSel ? fieldSel.value : '__all'));
            });

            renderResults();
        }

        function selectRecord(rec) { selectedRecordKey = rec.key; renderResults(); renderDetail(rec); openDetailOverlay(); }
        function renderDetail(rec) {
            if (!rec) { detailContainer.innerHTML = '<div class="detail-empty"><div class="icon">&#128203;</div><p>' + escapeHtml(t('detailEmpty')) + '</p></div>'; detailContainer.className = 'detail-empty'; return; }
            detailContainer.className = '';
            var html = '<div class="detail-header"><h2>' + escapeHtml(rec.entity) + '</h2>';
            html += '<div class="detail-subtitle">ID: ' + escapeHtml(rec.id || '\u2014') + ' • ' + escapeHtml(t('record')) + ' #' + rec.pos + '</div></div>';
            html += '<div class="detail-scroll">';
            html += renderElementDetail(rec.element);
            html += '</div>';
            detailContainer.innerHTML = html;
        }
        function isShortField(label, value, skipped) { if (skipped) return true; if (!value || !value.trim()) return true; if (label.length > 22) return false; if (value === 'true' || value === 'false') return true; return value.length <= 35; }
        function renderSimpleFields(simples) {
            var html = '', i = 0;
            while (i < simples.length) {
                var c = simples[i], label = fmtLabel(c.tagName), value = (c.textContent || '').trim(), sk = c.getAttribute('skippedBecause');
                if (i + 1 < simples.length) {
                    var c2 = simples[i + 1], label2 = fmtLabel(c2.tagName), value2 = (c2.textContent || '').trim(), sk2 = c2.getAttribute('skippedBecause');
                    if (isShortField(label, value, sk) && isShortField(label2, value2, sk2)) {
                        html += '<div class="field-pair">';
                        html += '<div class="field-row"><div class="field-label">' + escapeHtml(label) + '</div><div class="field-value">' + fmtValue(c.tagName, value, sk) + '</div></div>';
                        html += '<div class="field-row"><div class="field-label">' + escapeHtml(label2) + '</div><div class="field-value">' + fmtValue(c2.tagName, value2, sk2) + '</div></div>';
                        html += '</div>'; i += 2; continue;
                    }
                }
                html += '<div class="field-row"><div class="field-label">' + escapeHtml(label) + '</div><div class="field-value">' + fmtValue(c.tagName, value, sk) + '</div></div>';
                i++;
            }
            return html;
        }
        function renderElementDetail(el) {
            var children = Array.from(el.children || []);
            if (children.length === 0) return '';
            var simples = [], complex = [];
            children.forEach(function (c) { if ((c.children || []).length === 0) simples.push(c); else complex.push(c); });
            var html = '';
            if (simples.length > 0) { html += '<div class="field-group"><div class="field-group-title">' + escapeHtml(t('properties')) + '</div>'; html += renderSimpleFields(simples); html += '</div>'; }
            var groups = {};
            complex.forEach(function (c) { if (!groups[c.tagName]) groups[c.tagName] = []; groups[c.tagName].push(c); });
            Object.entries(groups).forEach(function (entry) {
                var tag = entry[0], elements = entry[1];
                if (elements.length === 1 && !hasRepeatingChildren(elements[0])) {
                    html += '<div class="field-group"><div class="field-group-title">' + escapeHtml(fmtLabel(tag)) + '</div>' + renderEmbedded(elements[0]) + '</div>';
                } else if (elements.length === 1 && hasRepeatingChildren(elements[0])) {
                    var size = elements[0].getAttribute('size');
                    html += '<div class="field-group"><div class="field-group-title">' + escapeHtml(fmtLabel(tag));
                    if (size) html += ' <span class="collection-badge">' + size + ' items</span>';
                    html += '</div>' + renderCollection(elements[0]) + '</div>';
                } else {
                    html += '<div class="field-group"><div class="field-group-title">' + escapeHtml(fmtLabel(tag)) + ' <span class="collection-badge">' + elements.length + ' items</span></div>';
                    html += renderInlineCollection(elements) + '</div>';
                }
            });
            return html;
        }
        function hasRepeatingChildren(el) { var ch = Array.from(el.children || []); if (ch.length <= 1) return false; var tags = new Set(ch.map(function (c) { return c.tagName; })); return tags.size < ch.length; }
        function renderEmbedded(el) {
            var ch = Array.from(el.children || []), simples = [], complex = [];
            ch.forEach(function (c) { if ((c.children || []).length === 0) simples.push(c); else complex.push(c); });
            var html = renderSimpleFields(simples);
            complex.forEach(function (c) { html += '<div class="field-row"><div class="field-label">' + escapeHtml(fmtLabel(c.tagName)) + '</div><div class="field-value">' + renderSubSection(c) + '</div></div>'; });
            return html;
        }
        function renderSubSection(el) {
            var ch = Array.from(el.children || []);
            if (ch.length === 0) return escapeHtml((el.textContent || '').trim());
            if (hasRepeatingChildren(el)) return renderCollection(el);
            var html = '<div style="margin:4px 0;">';
            ch.forEach(function (c) {
                if ((c.children || []).length === 0) {
                    html += '<div style="display:flex;gap:8px;padding:2px 0;"><span style="font-weight:600;color:var(--c-text-secondary);font-size:12px;min-width:90px;">' + escapeHtml(c.tagName) + '</span><span>' + fmtValue(c.tagName, (c.textContent || '').trim(), c.getAttribute('skippedBecause')) + '</span></div>';
                } else {
                    html += '<div style="margin:4px 0;"><div style="font-weight:600;color:var(--c-text-secondary);font-size:12px;margin-bottom:2px;">' + escapeHtml(c.tagName) + '</div>' + renderSubSection(c) + '</div>';
                }
            });
            html += '</div>';
            return html;
        }
        function renderCollection(wrapper) {
            var items = Array.from(wrapper.children || []);
            if (items.length === 0) return '<div class="field-row"><div class="field-value empty" style="flex:1">' + escapeHtml(t('noItems')) + '</div></div>';
            var colSet = new Set();
            items.forEach(function (item) { Array.from(item.children || []).forEach(function (c) { if ((c.children || []).length === 0) colSet.add(c.tagName); }); });
            var cols = Array.from(colSet);
            if (cols.length === 0) {
                var html = '';
                items.forEach(function (item, idx) { html += '<div class="field-group-title">#' + (idx + 1) + ' ' + escapeHtml(item.tagName) + '</div>'; html += renderEmbedded(item); });
                return html;
            }
            var hasId = items[0] && items[0].getAttribute('id');
            var html = '<div style="padding:6px 12px;overflow-x:auto;"><table class="collection-table"><thead><tr>';
            if (hasId) html += '<th>ID</th>';
            cols.forEach(function (c) { html += '<th>' + escapeHtml(fmtLabel(c)) + '</th>'; });
            html += '</tr></thead><tbody>';
            items.forEach(function (item) {
                html += '<tr>';
                if (hasId) html += '<td style="font-family:var(--font-mono);font-size:11px;color:var(--c-text-muted);">' + escapeHtml(item.getAttribute('id') || '') + '</td>';
                cols.forEach(function (col) { var el = Array.from(item.children || []).find(function (c) { return c.tagName === col; }); var val = el ? (el.textContent || '').trim() : ''; html += '<td>' + fmtValue(col, val, el ? el.getAttribute('skippedBecause') : null) + '</td>'; });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }
        function renderInlineCollection(elements) {
            var colSet = new Set();
            elements.forEach(function (item) { Array.from(item.children || []).forEach(function (c) { if ((c.children || []).length === 0) colSet.add(c.tagName); }); });
            var cols = Array.from(colSet);
            if (cols.length === 0) {
                var html = '';
                elements.forEach(function (item, idx) { html += '<div class="field-group-title">#' + (idx + 1) + '</div>' + renderEmbedded(item); });
                return html;
            }
            var hasId = elements[0] && elements[0].getAttribute('id');
            var html = '<div style="padding:6px 12px;overflow-x:auto;"><table class="collection-table"><thead><tr>';
            if (hasId) html += '<th>ID</th>';
            cols.forEach(function (c) { html += '<th>' + escapeHtml(fmtLabel(c)) + '</th>'; });
            html += '</tr></thead><tbody>';
            elements.forEach(function (item) {
                html += '<tr>';
                if (hasId) html += '<td style="font-family:var(--font-mono);font-size:11px;color:var(--c-text-muted);">' + escapeHtml(item.getAttribute('id') || '') + '</td>';
                cols.forEach(function (col) { var el = Array.from(item.children || []).find(function (c) { return c.tagName === col; }); var val = el ? (el.textContent || '').trim() : ''; html += '<td>' + fmtValue(col, val, el ? el.getAttribute('skippedBecause') : null) + '</td>'; });
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            return html;
        }

        function fmtLabel(name) { return name.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/^./, function (c) { return c.toUpperCase(); }); }
        function fmtValue(fieldName, value, skipped) {
            if (skipped) return '<span style="color:var(--c-text-muted);font-size:12px;font-style:italic;">skipped</span>';
            if (!value || !value.trim()) return '<span class="empty">\u2014</span>';
            var lo = fieldName.toLowerCase();
            if (value === 'true') return '<span class="badge badge-true">\u2713 True</span>';
            if (value === 'false') return '<span class="badge badge-false">\u2717 False</span>';
            if (lo === 'id' || lo.startsWith('id') || lo.endsWith('id')) return '<span class="badge badge-id">' + escapeHtml(value) + '</span>';
            if (/^-?\d+(\.\d+)?$/.test(value)) return '<span class="badge badge-number">' + escapeHtml(value) + '</span>';
            if (value.length > 200) return '<div style="max-height:120px;overflow-y:auto;font-size:13px;">' + escapeHtml(value) + '</div>';
            return escapeHtml(value);
        }

        function initialize() {
            try {
                parseXml();
                buildDiscoveredFields();
                renderColumnsMenu();
                filteredRecords = allRecords.slice();
                addCondition();
                applyLanguage();
                renderResults();
                resultsCount.textContent = allRecords.length + ' ' + t('resultsTotal');
            } catch (err) {
                resultsCount.textContent = t('err') + ': ' + (err.message || 'Unknown');
                resultsBody.innerHTML = '<tr><td colspan="3"><div class="results-empty"><p>' + escapeHtml(t('failed')) + '</p></div></td></tr>';
            }
        }

        addConditionBtn.addEventListener('click', addCondition);
        clearSearchBtn.addEventListener('click', function () {
            conditionsContainer.innerHTML = '';
            searchApplied = false;
            filteredRecords = allRecords.slice();
            currentPage = 1;
            addCondition();
            renderResults();
            selectedRecordKey = null;
            renderDetail(null);
            closeDetailOverlay();
        });
        searchBtn.addEventListener('click', applySearch);
        pageSizeSelect.addEventListener('change', function () { currentPage = 1; renderResults(); });
        prevBtn.addEventListener('click', function () { if (currentPage > 1) { currentPage--; renderResults(); } });
        nextBtn.addEventListener('click', function () { var tp = Math.max(1, Math.ceil(filteredRecords.length / getPageSize())); if (currentPage < tp) { currentPage++; renderResults(); } });
        languageSelect.addEventListener('change', function () { currentLanguage = languageSelect.value === 'en' ? 'en' : 'fr'; applyLanguage(); });
        columnsBtn.addEventListener('click', function () { columnsMenu.classList.toggle('open'); });
        document.addEventListener('click', function (e) { if (!columnsMenu.contains(e.target) && !columnsBtn.contains(e.target)) columnsMenu.classList.remove('open'); });
        detailCloseBtn.addEventListener('click', closeDetailOverlay);
        detailOverlay.addEventListener('click', function (e) { if (e.target === detailOverlay) closeDetailOverlay(); });
        document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetailOverlay(); });

        initialize();
    </script>
</body>

</html>
